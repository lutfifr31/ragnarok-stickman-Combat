<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    
    <linearGradient id="bgMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#130509" />
      <stop offset="50%" stop-color="#08080D" />
      <stop offset="100%" stop-color="#04101D" />
